[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge-runtime"
version = "0.1.0"
description = "A bounded, thread-based FIFO job runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
taskforge = "taskforge.__main__:main"

[tool.setuptools.packages.find]
include = ["taskforge*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
