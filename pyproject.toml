[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge-runtime"
version = "0.4.0"
description = "Bounded job scheduling for threads and spawned processes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/aadarsha-hiremath/taskforge-runtime-public"

[project.scripts]
taskforge = "taskforge.__main__:main"

[tool.setuptools.packages.find]
include = ["taskforge*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
