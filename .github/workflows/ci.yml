name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install TaskForge
        run: python -m pip install .
      - name: Run all tests, including spawned workers and cleanup
        timeout-minutes: 4
        run: >-
          python -X faulthandler -c "import sys, unittest;
          suite = unittest.defaultTestLoader.discover('.');
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          sys.exit(not result.wasSuccessful() or not result.testsRun or bool(result.skipped))"
      - name: Smoke test the installed thread CLI
        working-directory: ${{ runner.temp }}
        timeout-minutes: 2
        run: python -I -m taskforge --backend thread --stats 2 3 4
      - name: Smoke test the installed process CLI
        working-directory: ${{ runner.temp }}
        timeout-minutes: 2
        run: python -I -m taskforge --backend process --stats 2 3 4
      - name: Check code and packaging
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        shell: bash
        run: |
          python -m pip install ruff mypy build twine
          python -m ruff check taskforge tests benchmarks
          python -m ruff format --check taskforge tests benchmarks
          python -m mypy --strict taskforge tests benchmarks
          python -m build
          python -m twine check --strict dist/*
          cd "$RUNNER_TEMP"
          python -m venv taskforge-wheel
          taskforge-wheel/bin/python -m pip install --no-index --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          taskforge-wheel/bin/python -m pip check
          taskforge-wheel/bin/python -I -c "from importlib.metadata import metadata; assert metadata('taskforge-runtime')['Project-URL'] == 'Repository, https://github.com/aadarsha-hiremath/taskforge-runtime-public'"
          taskforge-wheel/bin/taskforge --backend thread --stats 2 3 4
          taskforge-wheel/bin/taskforge --backend process --stats 2 3 4
